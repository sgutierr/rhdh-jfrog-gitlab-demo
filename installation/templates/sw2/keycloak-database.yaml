apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: '{{ .Values.keycloak.statefulSetName }}'
  namespace: '{{ .Values.keycloak.namespaceName }}'
  labels:
    app: postgres-db  
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  serviceName: postgresql-db
  selector:
    matchLabels:
      app: postgresql-db
  replicas: 1
  template:
    metadata:
      labels:
        app: postgresql-db
    spec:
      containers:
        - name: postgresql-db
          image: registry.redhat.io/rhel8/postgresql-13:latest
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - mountPath: /data
              name: cache-volume
          env: 
            - name: POSTGRESQL_PASSWORD
              value: '{{ .Values.keycloak.postgresPassword }}'
            - name: PGDATA
              value: /data/pgdata
            - name: POSTGRESQL_DATABASE
              value: '{{ .Values.keycloak.postgresDb }}'
            - name: POSTGRESQL_USER
              value: '{{ .Values.keycloak.postgresUsername }}'
      volumes:
        - name: cache-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-db
  namespace: '{{ .Values.keycloak.namespaceName }}' 
  labels:
    app: postgres-db  
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true  
spec:
  selector:
    app: postgresql-db
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
