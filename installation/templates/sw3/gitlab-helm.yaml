# installation/templates/sw3/gitlab-helm.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: install-gitlab-helm
  namespace: {{ .Values.gitlab.namespaceName }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      serviceAccountName: gitlab
      containers:
      - name: helm
        image: docker.io/alpine/helm:latest
        env:
          # Configurar Helm para usar un directorio con permisos de escritura
          - name: HELM_HOME
            value: /tmp/helm
          - name: XDG_CONFIG_HOME
            value: /tmp
          - name: XDG_CACHE_HOME
            value: /tmp        
        command:
        - /bin/sh
        - -c
        - |
          set -e
          
          mkdir -p /tmp/helm
          chmod 755 /tmp/helm
          
          # Verificar conectividad de red
          echo "Verificando conectividad de red..."
          if ! wget --spider --timeout=30 https://charts.gitlab.io/index.yaml 2>/dev/null; then
            echo "ADVERTENCIA: No se pudo verificar conectividad con charts.gitlab.io"
            echo "Intentando continuar de todas formas..."
          else
            echo "Conectividad verificada"
          fi
          
          # Intentar agregar el repositorio con reintentos
          echo "Agregando repositorio de GitLab..."
          MAX_RETRIES=5
          RETRY_COUNT=0
          REPO_ADDED=false
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if helm repo add gitlab https://charts.gitlab.io/ 2>/dev/null; then
              echo "Repositorio agregado exitosamente"
              REPO_ADDED=true
              break
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "Intento $RETRY_COUNT/$MAX_RETRIES falló, reintentando en 10 segundos..."
              sleep 10
            fi
          done
          
          if [ "$REPO_ADDED" = "false" ]; then
            echo "ERROR: No se pudo agregar el repositorio después de $MAX_RETRIES intentos"
            echo "Verificando si el repositorio ya existe..."
            if helm repo list | grep -q "^gitlab"; then
              echo "El repositorio ya existe, continuando..."
            else
              echo "ERROR CRÍTICO: No se puede continuar sin el repositorio"
              exit 1
            fi
          fi
          
          # Actualizar repositorio con timeout aumentado
          echo "Actualizando repositorio..."
          if ! helm repo update gitlab --timeout 60s 2>/dev/null; then
            echo "ADVERTENCIA: No se pudo actualizar el repositorio, usando caché local si existe"
          fi
          
          # Verificar que el repositorio está disponible
          echo "Verificando disponibilidad del chart..."
          if ! helm search repo gitlab/gitlab --versions 2>/dev/null | head -n 1; then
            echo "ADVERTENCIA: No se puede buscar en el repositorio, pero continuando..."
          fi
          helm install gitlab gitlab/gitlab \
            --namespace {{ .Values.gitlab.namespaceName }} \
            --version {{ .Values.gitlab.version }} \
            --set global.hosts.domain={{ .Values.cluster.domain }} \
            --set global.hosts.hostSuffix={{ .Values.gitlab.instanceName }} \
            --set global.ingress.class=none \
            --set global.ingress.configureCertmanager=false \
            --set global.ingress.annotations."route\.openshift\.io/termination"=edge \
            --set global.ingress.tls.enabled=false \
            --set global.kas.enabled=false \
            --set webservice.replicas=1 \
            --set sidekiq.replicas=1 \
            --set gitlab-shell.replicas=1 \
            --set gitlab-registry.replicas=1 \
            --set prometheus.alertmanager.enabled=false \
            --set prometheus.pushgateway.enabled=false \
            --set prometheus.server.enabled=false \
            --set nginx-ingress.enabled=false \
            --set certmanager.install=false \
            --set postgresql.primary.extendedConfiguration="max_connections = 200" \
            --set global.podSecurityPolicy.enabled=false \
            --set global.seccomp.enabled=false \
            --set shared-secrets.securityContext.seccompProfile.type=RuntimeDefault \
            --set shared-secrets.securityContext.runAsUser=1000780000 \
            --set shared-secrets.securityContext.fsGroup=1000780000 \
            --set shared-secrets.securityContext.hostUsers=false \
            --set global.securityContext.runAsUser=1000780000 \
            --set global.securityContext.fsGroup=1000780000 \
            --set global.securityContext.hostUsers=false \            
            --timeout 10m
          echo "GitLab instalado. Asignando SCC anyuid a ServiceAccounts..."
          
          # Esperar un momento para que los ServiceAccounts se creen
          sleep 10
          
          # Asignar SCC anyuid a todos los ServiceAccounts de GitLab
          for sa in gitlab-shared-secrets gitlab gitlab-runner; do
            if oc get serviceaccount $sa -n {{ .Values.gitlab.namespaceName }} 2>/dev/null; then
              echo "Asignando SCC anyuid a $sa"
              oc adm policy add-scc-to-user anyuid -z $sa -n {{ .Values.gitlab.namespaceName }} || true
            fi
          done
          
          # Asignar a cualquier otro ServiceAccount que GitLab haya creado
          for sa in $(oc get serviceaccount -n {{ .Values.gitlab.namespaceName }} -o name 2>/dev/null | grep -E "(gitlab|shared)"); do
            sa_name=$(echo $sa | cut -d'/' -f2)
            echo "Asignando SCC anyuid a $sa_name"
            oc adm policy add-scc-to-user anyuid -z $sa_name -n {{ .Values.gitlab.namespaceName }} || true
          done
          
          echo "Instalación completada"
      restartPolicy: Never
  backoffLimit: 2